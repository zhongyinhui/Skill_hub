name: Package Module Skills

on:
  push:
    branches:
      - release
    paths:
      - "modules/**"
      - "templates/**"
      - "tools/validate-skill.ps1"
      - "tools/package-modules.ps1"
      - ".github/workflows/package-modules.yml"
  pull_request:
    branches:
      - release
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "modules/**"
      - "templates/**"
      - "tools/validate-skill.ps1"
      - "tools/package-modules.ps1"
      - ".github/workflows/package-modules.yml"

permissions:
  contents: write

jobs:
  package-modules:
    name: Package Module Zips
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 校验 skill 格式
        shell: pwsh
        run: ./tools/validate-skill.ps1

      - name: 生成模块压缩包
        shell: pwsh
        run: ./tools/package-modules.ps1 -OutputDir dist/module-zips

      - name: 写入运行摘要
        shell: pwsh
        run: |
          "## 模块 skill 压缩包" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -Path dist/module-zips -Filter "*.zip" | Sort-Object Name | ForEach-Object {
            "- $($_.Name)" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: 上传共享模块压缩包
        uses: actions/upload-artifact@v7
        with:
          path: dist/module-zips/_shared-skills.zip
          if-no-files-found: error
          archive: false
          retention-days: 14

      - name: 上传客户成功模块压缩包
        uses: actions/upload-artifact@v7
        with:
          path: dist/module-zips/customer-success-skills.zip
          if-no-files-found: error
          archive: false
          retention-days: 14

      - name: 上传销售模块压缩包
        uses: actions/upload-artifact@v7
        with:
          path: dist/module-zips/sales-skills.zip
          if-no-files-found: error
          archive: false
          retention-days: 14

      - name: 上传 IP 部门模块压缩包
        uses: actions/upload-artifact@v7
        with:
          path: dist/module-zips/ip-skills.zip
          if-no-files-found: error
          archive: false
          retention-days: 14

      - name: 上传私域部门模块压缩包
        uses: actions/upload-artifact@v7
        with:
          path: dist/module-zips/private-domain-skills.zip
          if-no-files-found: error
          archive: false
          retention-days: 14

      - name: 上传 HR 部门模块压缩包
        uses: actions/upload-artifact@v7
        with:
          path: dist/module-zips/hr-skills.zip
          if-no-files-found: error
          archive: false
          retention-days: 14

      - name: 发布到 GitHub Releases
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (Get-Variable PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $releaseVersion = "v$((Get-Date).ToUniversalTime().ToString('yyyy.MM.dd'))-$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          $releaseTag = "module-skills/$releaseVersion"
          $releaseTitle = "模块 Skill $releaseVersion 压缩包"

          $assets = Get-ChildItem -Path dist/module-zips -Filter "*.zip" | Sort-Object Name | ForEach-Object { $_.FullName }
          if ($assets.Count -eq 0) {
            throw "dist/module-zips 下没有可发布的 zip 文件"
          }

          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release 版本已存在：$releaseTag"
          }

          $notes = @"
          由 release 分支自动生成。

          版本：$releaseVersion

          提交：${{ github.sha }}
          "@

          gh release create $releaseTag $assets `
            --title $releaseTitle `
            --notes $notes `
            --target $env:GITHUB_SHA `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "创建 release 失败：$releaseTag"
          }
